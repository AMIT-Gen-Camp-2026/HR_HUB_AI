[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# فيه أكتر من فولدر top-level بيبان زي package لـ setuptools (app, config,
# ui, data, eval, notebooks) - من غير التصريح ده، الـ auto-discovery بيرفض
# يبني الـ editable install خالص ("Multiple top-level packages discovered").
# المشروع فعليًا محتاج بس app/ و config/ يتثبتوا كـ packages - باقي
# الفولدرات (ui, scripts, tests, eval, data, notebooks) بتشتغل عن طريق
# تشغيلها من جوه ai-service/ (Python بيضيف cwd للـ sys.path تلقائيًا)،
# مش عن طريق import كـ package مثبت.
include = ["app*", "config*"]

[project]
name = "amit-ai-service"
version = "0.1.0"
description = "AI service for AMIT Instructor Hub — CV parsing, ranking, assessment and assistant"
requires-python = ">=3.11"

dependencies = [
    # service — Flask, مش FastAPI. app/main.py هو الـ WSGI app الحقيقي الوحيد.
    "flask>=3.0",
    "flask-limiter>=3.8",
    "gunicorn>=23.0",          # production WSGI server (Dockerfile بيستخدمه)
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    # config
    "pyyaml>=6.0",
    # documents
    "python-docx>=1.1",
    "pdfplumber>=0.11",
    # text
    "rapidfuzz>=3.10",
    "pyarabic>=0.6.15",
    # providers — hf_provider.py (extraction) + embeddings.py (local أو API)
    "huggingface-hub>=0.26",
    "httpx>=0.27",             # embeddings.py: OpenAI-compatible API calls (Gemini)
]

[project.optional-dependencies]
# EMBEDDING_PROVIDER=local بيحتاج الحزمة دي (بتجيب torch معاها، تقيلة).
# EMBEDDING_PROVIDER=api (الوضع الافتراضي حاليًا مع Gemini) محتاج بس
# httpx اللي فوق أصلاً - من غير الحزمة دي خالص. اسم الـ group اتسيب "hf"
# عشان Makefile's `install-hf` يفضل شغال من غير تغيير.
hf = [
    "sentence-transformers>=3.2",
]
eval = [
    "pandas>=2.2",
]
ui = [
    "streamlit>=1.39",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "detect-secrets>=1.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --cov=app --cov-report=term-missing"

[tool.coverage.report]
# الرقم الحقيقي دلوقتي ~50% (انظر docs/DECISIONS.md). حطينا الحد عند 49 عشان
# make test ميفشلش زورًا، لكن أي PR جديد المفروض يرفع الرقم ده مش ينزله.
# main.py (Flask routes)، hf_provider.py، extract_text_pdf/docx لسه مش
# متغطيين باختبارات - دي أولوية قبل أي integration مع الـ full stack.
fail_under = 49