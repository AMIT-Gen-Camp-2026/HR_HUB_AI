services:
  ai-service:
    build:
      context: .
      target: base
    ports:
      - "5000:5000"          # لازم يطابق FLASK_PORT في .env (default 5000)
    env_file:
      - .env
    volumes:
      - ./app:/srv/app
      - ./config:/srv/config

  ui:
    build:
      context: .
      target: base
    command: streamlit run ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      # ملحوظة: ui/streamlit_app.py حاليًا BASE_URL مكتوبة hardcoded كـ
      # http://127.0.0.1:5000 - المتغير ده مش مقروء فعليًا لسه (انظر
      # docs/DECISIONS.md لتفاصيل الفجوة دي وخطة إصلاحها).
      AI_SERVICE_URL: http://ai-service:5000
    depends_on:
      - ai-service

  # redis اتشالت من هنا - مفيش حاجة في الكود الفعلي بتستخدمها دلوقتي
  # (الـ rate limiter شغال in-memory). لو حبينا نعمل rate limiting/caching
  # مشترك بين أكتر من gunicorn worker، وقتها نضيفها تاني ونربطها فعليًا.