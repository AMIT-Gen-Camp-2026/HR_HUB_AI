name: CI

on:
  push:
    branches: [main, develop]
    paths: ["ai-service/**"]
  pull_request:
    paths: ["ai-service/**"]

defaults:
  run:
    working-directory: ai-service

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install -U pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy app

      - name: Secret scan
        run: detect-secrets scan --baseline .secrets.baseline

      - name: Tests (stub provider — no network, no key)
        env:
          PROVIDER: stub
        run: pytest

      - name: Redaction test — must never send an identifier outside
        env:
          PROVIDER: stub
        run: pytest tests/unit/test_redaction.py -v

  evaluation:
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,eval]"
      - name: Extraction metric on the small subset
        env:
          PROVIDER: stub
        run: python -m eval.runners.run_extraction --dataset cv-extraction@v1 --subset ci --fail-under 0.60
