version: 1
disable_existing_loggers: false

formatters:
  json:
    format: '%(asctime)s %(levelname)s %(name)s %(message)s'
  console:
    format: '%(asctime)s │ %(levelname)-7s │ %(name)-22s │ %(message)s'
    datefmt: '%H:%M:%S'

handlers:
  console:
    class: logging.StreamHandler
    formatter: console
    stream: ext://sys.stdout

loggers:
  app:
    level: INFO
    handlers: [console]
    propagate: false
  uvicorn.access:
    level: WARNING

root:
  level: INFO
  handlers: [console]
