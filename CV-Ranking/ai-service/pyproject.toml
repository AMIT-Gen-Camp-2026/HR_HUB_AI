[project]
name = "amit-ai-service"
version = "0.1.0"
description = "AI service for AMIT Instructor Hub — CV parsing, ranking, assessment and assistant"
requires-python = ">=3.11,<3.12"

dependencies = [
    # service
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    # config and prompts
    "pyyaml>=6.0",
    "jinja2>=3.1",
    # documents
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "pdfplumber>=0.11",
    # text
    "rapidfuzz>=3.10",
    "pyarabic>=0.6.15",
    # providers
    "httpx>=0.27",
    # ml
    "numpy>=1.26",
    "scikit-learn>=1.5",
    # telemetry
    "structlog>=24.4",
]

[project.optional-dependencies]
hf = [
    "transformers>=4.45",
    "torch>=2.4",
    "sentence-transformers>=3.2",
    "huggingface-hub>=0.26",
]
eval = [
    "mlflow>=2.17",
    "pandas>=2.2",
]
ui = [
    "streamlit>=1.39",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "detect-secrets>=1.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --cov=app --cov-report=term-missing"

[tool.coverage.report]
fail_under = 70
